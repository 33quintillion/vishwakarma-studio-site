font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); box-sizing: border-box; }
.vsg *, .vsg *::before, .vsg *::after { box-sizing: border-box; }
.vsg button, .vsg input, .vsg select, .vsg textarea { font: inherit; color: inherit; }

.vsg-brand b { font-size: 22px; letter-spacing: .02em; } .vsg-brand span { font-size: 22px; font-weight: 300; }
.vsg-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.vsg-card.wide { max-width: 560px; }
.vsg-card h1 { font-size: 20px; margin: 0 0 6px; } .vsg-card h2 { font-size: 16px; margin: 18px 0 8px; }

.vsg-muted { color: var(--muted); } .vsg-small { font-size: 12.5px; }

.vsg-tabs button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 7px; font-weight: 600; color: var(--muted); cursor: pointer; }
.vsg-tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.vsg-field { display: block; margin-bottom: 12px; }

.vsg-field input, .vsg-field select, .vsg-field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.vsg-field input:focus, .vsg-field select:focus, .vsg-field textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: transparent; }
.vsg-row { display: flex; gap: 10px; } .vsg-row > * { flex: 1; min-width: 0; }
.vsg-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 4px 0 14px; }
.vsg-check input { margin-top: 3px; }
.vsg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.vsg-btn:hover { background: var(--soft); }
.vsg-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .vsg-btn.primary:hover { background: var(--accent-2); }
.vsg-btn.danger { color: var(--err); } .vsg-btn.small { padding: 5px 9px; font-size: 12.5px; }
.vsg-btn.block { width: 100%; padding: 11px; }
.vsg-btn:disabled { opacity: .5; cursor: default; }
.vsg-link { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; text-decoration: none; }
.vsg-link:hover { text-decoration: underline; }
.vsg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.vsg-msg { border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; font-size: 13px; }
.vsg-msg.err { background: #fdecec; color: #8f1f1f; } .vsg-msg.ok { background: #e9f7f0; color: #145c40; } .vsg-msg.info { background: #eef4fb; color: #1d4f80; } .vsg-msg.warn { background: #fff4de; color: #7a5200; }
.vsg-status { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.vsg-status .ic { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--soft); }
.vsg-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: vsg-spin .8s linear infinite; margin: 30px auto 14px; }
@keyframes vsg-spin { to { transform: rotate(360deg); } }
.vsg-loading { color: #cfdbe7; text-align: center; }
.vsg-foot { margin-top: auto; padding-top: 24px; color: #8ea3b8; font-size: 12px; text-align: center; }
.vsg-foot a, .vsg-foot button { color: #b9cbe0; }
.vsg-list { list-style: none; margin: 8px 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
.vsg-list li { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.vsg-list li:first-child { border-top: 0; }
.vsg-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0; font-size: 13.5px; }
.vsg-kv dt { color: var(--muted); } .vsg-kv dd { margin: 0; }
.vsg-legal { max-height: 50vh; overflow: auto; font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; }

.vsg-main { flex: 1; overflow: auto; padding: 18px 16px 40px; }
.vsg-wrap { max-width: 1200px; margin: 0 auto; }
