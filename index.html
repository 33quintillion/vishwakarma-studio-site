<style>
.vsg { --bg: #0f1a26; --card: #ffffff; --ink: #1d2733; --muted: #6b7886; --line: #dce3ea; --soft: #f4f7fa;
--top: #13283c; --accent: #e0592a; --accent-2: #c94a1f; --blue: #2a7fd0; --ok: #1f9d6b; --warn: #c98a0b; --err: #cf3a3a;
font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); box-sizing: border-box; }
.vsg *, .vsg *::before, .vsg *::after { box-sizing: border-box; }
.vsg button, .vsg input, .vsg select, .vsg textarea { font: inherit; color: inherit; }
.vsg [hidden] { display: none !important; }
.vsg-page { position: fixed; inset: 0; overflow: auto; background: radial-gradient(1200px 600px at 20% -10%, #24476a 0%, transparent 60%), var(--bg); display: flex; flex-direction: column; align-items: center; padding: 32px 16px 16px; z-index: 2147483000; }
.vsg-brand { display: flex; align-items: center; gap: 10px; color: #fff; margin: 8px 0 22px; }
.vsg-brand .logo { color: var(--accent); display: grid; }
.vsg-brand b { font-size: 22px; letter-spacing: .02em; } .vsg-brand span { font-size: 22px; font-weight: 300; }
.vsg-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.vsg-card.wide { max-width: 560px; }
.vsg-card h1 { font-size: 20px; margin: 0 0 6px; } .vsg-card h2 { font-size: 16px; margin: 18px 0 8px; }
.vsg-card p { margin: 6px 0 12px; }
.vsg-muted { color: var(--muted); } .vsg-small { font-size: 12.5px; }
.vsg-tabs { display: flex; background: var(--soft); border-radius: 9px; padding: 3px; margin-bottom: 18px; }
.vsg-tabs button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 7px; font-weight: 600; color: var(--muted); cursor: pointer; }
.vsg-tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.vsg-field { display: block; margin-bottom: 12px; }
.vsg-field > span { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.vsg-field input, .vsg-field select, .vsg-field textarea { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.vsg-field input:focus, .vsg-field select:focus, .vsg-field textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: transparent; }
.vsg-row { display: flex; gap: 10px; } .vsg-row > * { flex: 1; min-width: 0; }
.vsg-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin: 4px 0 14px; }
.vsg-check input { margin-top: 3px; }
.vsg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.vsg-btn:hover { background: var(--soft); }
.vsg-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .vsg-btn.primary:hover { background: var(--accent-2); }
.vsg-btn.danger { color: var(--err); } .vsg-btn.small { padding: 5px 9px; font-size: 12.5px; }
.vsg-btn.block { width: 100%; padding: 11px; }
.vsg-btn:disabled { opacity: .5; cursor: default; }
.vsg-link { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; text-decoration: none; }
.vsg-link:hover { text-decoration: underline; }
.vsg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.vsg-msg { border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; font-size: 13px; }
.vsg-msg.err { background: #fdecec; color: #8f1f1f; } .vsg-msg.ok { background: #e9f7f0; color: #145c40; } .vsg-msg.info { background: #eef4fb; color: #1d4f80; } .vsg-msg.warn { background: #fff4de; color: #7a5200; }
.vsg-status { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.vsg-status .ic { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: var(--soft); }
.vsg-spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: vsg-spin .8s linear infinite; margin: 30px auto 14px; }
@keyframes vsg-spin { to { transform: rotate(360deg); } }
.vsg-loading { color: #cfdbe7; text-align: center; }
.vsg-foot { margin-top: auto; padding-top: 24px; color: #8ea3b8; font-size: 12px; text-align: center; }
.vsg-foot a, .vsg-foot button { color: #b9cbe0; }
.vsg-list { list-style: none; margin: 8px 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; }
.vsg-list li { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.vsg-list li:first-child { border-top: 0; }
.vsg-kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0; font-size: 13.5px; }
.vsg-kv dt { color: var(--muted); } .vsg-kv dd { margin: 0; }
.vsg-legal { max-height: 50vh; overflow: auto; font-size: 12.5px; background: var(--soft); border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; }
.vsg-modal { position: fixed; inset: 0; background: rgba(10,20,30,.55); display: grid; place-items: center; padding: 16px; z-index: 2147483100; }
.vsg-modal .vsg-card { max-height: calc(100vh - 32px); overflow: auto; }
.vsg-banner { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 2147483050; background: #13283c; color: #fff; border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100vw - 32px); font-size: 13px; }
.vsg-banner button { background: none; border: 0; color: #b9cbe0; cursor: pointer; font-size: 16px; }
.vsg-key { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 480px) { .vsg-card { padding: 18px; } .vsg-row { flex-direction: column; gap: 0; } }
.vsg-admin { position: fixed; inset: 0; display: flex; flex-direction: column; background: #eef2f6; overflow: hidden; }
.vsg-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--top); color: #e7eef6; flex-wrap: wrap; }
.vsg-top .logo { color: var(--accent); display: grid; }
.vsg-top .title { font-weight: 700; } .vsg-top .grow { flex: 1; }
.vsg-top a, .vsg-top button { color: #e7eef6; }
.vsg-top .vsg-btn { background: transparent; border-color: #2f4a66; color: #e7eef6; }
.vsg-top .vsg-btn:hover { background: #1c3650; }
.vsg-nav { display: flex; gap: 2px; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; }
.vsg-nav button { border: 0; background: none; padding: 12px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.vsg-nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
.vsg-nav .badge { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.vsg-main { flex: 1; overflow: auto; padding: 18px 16px 40px; }
.vsg-wrap { max-width: 1200px; margin: 0 auto; }
.vsg-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.vsg-stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.vsg-stat .n { font-size: 26px; font-weight: 700; } .vsg-stat .l { color: var(--muted); font-size: 12.5px; }
.vsg-panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.vsg-panel h2 { font-size: 16px; margin: 0 0 10px; }
.vsg-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.vsg-toolbar input[type=search], .vsg-toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.vsg-toolbar input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
.vsg-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.vsg-chips button { border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.vsg-chips button.on { background: var(--top); border-color: var(--top); color: #fff; }
.vsg-table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
.vsg-table th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.vsg-table td { padding: 9px 10px; border-bottom: 1px solid #edf1f5; vertical-align: top; }
.vsg-table tr.click { cursor: pointer; } .vsg-table tr.click:hover td { background: #f7f9fc; }
.vsg-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.vsg-pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; background: #edf1f5; color: #4a5866; white-space: nowrap; }
.vsg-pill.pending { background: #fff4de; color: #7a5200; } .vsg-pill.approved, .vsg-pill.available, .vsg-pill.yes { background: #e9f7f0; color: #145c40; }
.vsg-pill.blocked, .vsg-pill.revoked, .vsg-pill.no { background: #fdecec; color: #8f1f1f; } .vsg-pill.admin { background: #fde9e1; color: #a03a14; }
.vsg-pill.seller, .vsg-pill.sold { background: #eef4fb; color: #1d4f80; } .vsg-pill.redeemed { background: #f0eefb; color: #4b3a9a; }
.vsg-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; box-shadow: -10px 0 40px rgba(0,0,0,.2); overflow: auto; padding: 20px; z-index: 2147483060; }
.vsg-drawer h1 { font-size: 19px; margin: 0 0 4px; }
.vsg-drawer h2 { font-size: 15px; margin: 20px 0 8px; }
.vsg-drawer .x { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--muted); }
.vsg-inline { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.vsg-inline .vsg-field { margin-bottom: 0; min-width: 110px; flex: 1; }
.vsg-codes { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--soft); border-radius: 8px; padding: 10px 12px; white-space: pre; overflow: auto; max-height: 260px; }
.vsg-toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #13283c; color: #fff; padding: 9px 14px; border-radius: 8px; z-index: 2147483200; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.vsg-toast.err { background: #8f1f1f; }
.vsg-empty { padding: 26px; text-align: center; color: var(--muted); }
.vsg-switch { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
@media (max-width: 700px) { .vsg-hide-sm { display: none; } }
